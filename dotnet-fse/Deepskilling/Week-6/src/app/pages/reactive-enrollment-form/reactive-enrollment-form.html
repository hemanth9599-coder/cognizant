<section class="form-page"><h1>Reactive Enrollment</h1><p>This version uses a TypeScript form model and custom validators.</p><form [formGroup]="enrollForm" (ngSubmit)="submit()" novalidate><label>Student name<input formControlName="studentName" /></label><span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.hasError('required')">Name is required.</span><label>Email<input type="email" formControlName="studentEmail" /></label><span *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.hasError('emailTaken')">Email taken.</span><label>Course ID / Code<input formControlName="courseId" placeholder="e.g. CS101" /></label><span *ngIf="enrollForm.get('courseId')?.hasError('noCourseCode')">Course code starting with XX is not allowed.</span><label>Preferred semester<select formControlName="preferredSemester"><option>Odd</option><option>Even</option></select></label><label class="checkbox"><input type="checkbox" formControlName="agreeToTerms" /> I agree to the terms.</label><span *ngIf="enrollForm.get('agreeToTerms')?.touched && enrollForm.get('agreeToTerms')?.invalid">You must agree to the terms.</span><div class="additional"><h2>Additional Courses</h2><button type="button" (click)="addCourse()">Add Another Course</button><div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="additional-row"><input [formControl]="ctrl" placeholder="Course code" /><button type="button" class="secondary" (click)="removeCourse(i)">Remove</button></div></div><button type="submit" [disabled]="enrollForm.invalid">Submit</button></form><div *ngIf="submitted" class="success">Reactive enrollment request submitted successfully!</div></section>
