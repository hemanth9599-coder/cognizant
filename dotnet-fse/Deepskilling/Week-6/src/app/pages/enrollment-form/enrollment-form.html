<section class="form-page"><h1>Enrollment Request</h1><p>Complete all fields to submit an enrollment request.</p><form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" novalidate><label>Student name<input name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel" /></label><span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required.</span><span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span><label>Email<input name="studentEmail" type="email" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel" /></label><span *ngIf="emailCtrl.touched && emailCtrl.invalid">Enter a valid email.</span><label>Course ID<input name="courseId" type="number" [(ngModel)]="courseId" required #courseCtrl="ngModel" /></label><span *ngIf="courseCtrl.touched && courseCtrl.invalid">Course ID is required.</span><label>Preferred semester<select name="preferredSemester" [(ngModel)]="preferredSemester" required #semesterCtrl="ngModel"><option value="">Choose a semester</option><option>Odd</option><option>Even</option></select></label><label class="checkbox"><input name="agreeToTerms" type="checkbox" [(ngModel)]="agreeToTerms" required #termsCtrl="ngModel" /> I agree to the terms.</label><span *ngIf="termsCtrl.touched && termsCtrl.invalid">You must agree to the terms.</span><div class="actions"><button type="submit" [disabled]="enrollForm.invalid">Submit</button><button type="button" class="secondary" (click)="reset(enrollForm)">Reset</button></div></form><div *ngIf="submitted" class="success">Enrollment request submitted successfully!</div></section>
