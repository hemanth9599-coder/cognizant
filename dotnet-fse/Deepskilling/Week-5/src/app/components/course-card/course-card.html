<article class="course-card" [ngClass]="cardClasses" [ngStyle]="{ 'border-left-color': borderColor }"><div class="card-top"><div><h3>{{ course.name }}</h3><p>{{ course.code }} · {{ course.credits | creditLabel }}</p></div><span [ngSwitch]="course.gradeStatus"><b *ngSwitchCase="'passed'" class="passed">Passed</b><b *ngSwitchCase="'failed'" class="failed">Failed</b><b *ngSwitchDefault class="pending">Pending</b></span></div>@if (isExpanded) { <p class="details">This course is available for the current semester.</p> }<div class="actions"><button (click)="isExpanded = !isExpanded">{{ isExpanded ? 'Hide Details' : 'Show Details' }}</button><button (click)="requestEnrollment()">Enroll</button></div></article>
