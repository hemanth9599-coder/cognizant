<section class="hero">
  <p class="eyebrow">WELCOME</p><h1>{{ portalName }}</h1>
  <p>Browse courses, track your progress, and submit enrollment requests in one place.</p>
  <div class="stats"><div><strong>{{ availableCourses }}</strong><span>Courses Available</span></div><div><strong>3</strong><span>Enrolled</span></div><div><strong>3.8</strong><span>GPA</span></div></div>
  <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
  @if (message) { <p class="success">{{ message }}</p> }
</section>
<section class="search-panel"><label for="search">Search courses</label><input id="search" [(ngModel)]="searchTerm" placeholder="Try Angular" /><p>Searching for: {{ searchTerm }}</p><!-- [property] is one-way component → DOM; [(ngModel)] is two-way DOM ↔ component. --></section>
